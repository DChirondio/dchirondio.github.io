<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" fill="none" role="img" aria-label="Xcode editor illustration">
  <defs>
    <style>
      /* Xcode Default (Dark) syntax palette */
      .kw   { fill:#ff7ab2; }  /* keywords */
      .type { fill:#d0a8ff; }  /* framework type names */
      .proj { fill:#5dd8ff; }  /* project type names */
      .str  { fill:#ff8170; }  /* string literals */
      .fn   { fill:#67b7a4; }  /* method / property calls */
      .pl   { fill:#dfe1e5; }  /* plain text */
      .ln   { fill:#585c66; }  /* line-number gutter */
      .code { font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; font-size:19px; font-weight:500; }
      .gutter { font-family:'JetBrains Mono', ui-monospace, monospace; font-size:15px; }
    </style>
  </defs>

  <!-- Xcode editor window -->
  <g transform="translate(20 20)">
    <!-- window body -->
    <rect x="0" y="0" width="680" height="480" rx="12" fill="#292a30" fill-opacity="0.95"/>
    <!-- title bar -->
    <rect x="0" y="0" width="680" height="40" rx="12" fill="#3a3b41" fill-opacity="0.98"/>
    <rect x="0" y="20" width="680" height="20" fill="#3a3b41" fill-opacity="0.98"/>
    <!-- traffic lights -->
    <circle cx="24" cy="20" r="6.5" fill="#ec6a5e"/>
    <circle cx="46" cy="20" r="6.5" fill="#f4bf4f"/>
    <circle cx="68" cy="20" r="6.5" fill="#61c454"/>
    <!-- filename tab -->
    <text class="gutter" x="330" y="25" fill="#a4a7ad">ContentView.swift</text>

    <!-- line-number gutter -->
    <rect x="0" y="40" width="48" height="440" fill="#2a2b31"/>
    <text class="gutter ln" x="30" y="86"  text-anchor="end">1</text>
    <text class="gutter ln" x="30" y="124" text-anchor="end">2</text>
    <text class="gutter ln" x="30" y="162" text-anchor="end">3</text>
    <text class="gutter ln" x="30" y="200" text-anchor="end">4</text>
    <text class="gutter ln" x="30" y="238" text-anchor="end">5</text>
    <text class="gutter ln" x="30" y="276" text-anchor="end">6</text>
    <text class="gutter ln" x="30" y="314" text-anchor="end">7</text>
    <text class="gutter ln" x="30" y="352" text-anchor="end">8</text>
    <text class="gutter ln" x="30" y="390" text-anchor="end">9</text>

    <!-- code -->
    <text class="code" x="66" y="92">
      <tspan class="kw">import</tspan><tspan class="pl"> SwiftUI</tspan>
    </text>
    <text class="code" x="66" y="130">
      <tspan class="kw">struct</tspan><tspan class="proj"> ContentView</tspan><tspan class="pl">: </tspan><tspan class="type">View</tspan><tspan class="pl"> {</tspan>
    </text>
    <text class="code" x="90" y="168">
      <tspan class="kw">var</tspan><tspan class="pl"> body: </tspan><tspan class="kw">some</tspan><tspan class="type"> View</tspan><tspan class="pl"> {</tspan>
    </text>
    <text class="code" x="114" y="206">
      <tspan class="type">VStack</tspan><tspan class="pl"> {</tspan>
    </text>
    <text class="code" x="138" y="244">
      <tspan class="type">Text</tspan><tspan class="pl">(</tspan><tspan class="str">"Diogo Chirondio"</tspan><tspan class="pl">)</tspan>
    </text>
    <text class="code" x="162" y="282">
      <tspan class="pl">.</tspan><tspan class="fn">font</tspan><tspan class="pl">(</tspan><tspan class="fn">.largeTitle</tspan><tspan class="pl">)</tspan>
    </text>
    <text class="code" x="114" y="320">
      <tspan class="pl">}</tspan>
    </text>
    <text class="code" x="90" y="358">
      <tspan class="pl">}</tspan>
    </text>
    <text class="code" x="66" y="396">
      <tspan class="pl">}</tspan>
    </text>
  </g>
</svg>
